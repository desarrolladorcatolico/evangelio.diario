name: Actualizar Evangelio diario

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  generar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Mostrar fecha y hora
        run: |
          echo "UTC:"
          date -u
          echo ""
          echo "Runner:"
          date

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Generar Evangelio
        run: |
          python evangelio.py --salida index.html

      - name: Detectar cambios
        id: cambios
        run: |
          git add index.html

          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> $GITHUB_OUTPUT
            echo "Sin cambios."
          else
            echo "hay_cambios=true" >> $GITHUB_OUTPUT
            echo "Hay cambios."
          fi

      - name: Guardar página generada
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "Evangelio Bot"
          git config user.email "actions@github.com"
          git commit -m "Actualizar Evangelio diario"
          git push

      - name: Resumen
        run: |
          echo "Workflow finalizado."
